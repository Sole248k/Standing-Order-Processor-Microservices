server:
  port: 8081

spring:
  application:
    name: ewb-standing-order-service
  datasource:
    url: jdbc:h2:mem:standing_order_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driverClassName: org.h2.Driver
    username: sa
    password: ""
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
  h2:
    console:
      enabled: true
      path: /h2-console

---
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: jdbc:postgresql://${DB_HOST:ewb-postgres}:${DB_PORT:5432}/standing_order_db
    driverClassName: org.postgresql.Driver
    username: ${DB_USER:ewb_user}
    password: ${DB_PASSWORD:ewb_pass}
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
